<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Ticket Dashboard</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,Arial;}

body{
    min-height:100vh;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
    padding:20px;
}

h1{margin-bottom:20px;}

.container{
    max-width:1100px;
    margin:auto;
}

.cards{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:20px;
}

.counter{
    flex:1;
    min-width:220px;
    padding:20px;
    text-align:center;
    border-radius:20px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    box-shadow:0 8px 32px rgba(0,0,0,0.3);
    animation:fade 0.6s ease;
}

.filters{
    margin-bottom:20px;
}

button{
    padding:8px 15px;
    margin:5px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.filter-btn{background:#ffffff22;color:white;}
.resolve{background:#00c853;color:white;}
.delete{background:#ff1744;color:white;}

.ticket{
    margin-bottom:15px;
    padding:20px;
    border-radius:20px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    box-shadow:0 8px 32px rgba(0,0,0,0.3);
    animation:fade 0.5s ease;
}

@keyframes fade{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
}

@media(max-width:700px){
    .cards{flex-direction:column;}
}
</style>
</head>

<body>

<div class="container">

<h1>Support Ticket Admin Panel</h1>

<div class="cards">
<div class="counter"><h3>Total</h3><h2 id="total">0</h2></div>
<div class="counter"><h3>Open</h3><h2 id="open">0</h2></div>
<div class="counter"><h3>Resolved</h3><h2 id="resolved">0</h2></div>
</div>

<div class="filters">
<button class="filter-btn" onclick="setFilter('all')">All</button>
<button class="filter-btn" onclick="setFilter('Open')">Open</button>
<button class="filter-btn" onclick="setFilter('Resolved')">Resolved</button>
</div>

<div id="ticketList"></div>

</div>

<script>

let filter="all";

function setFilter(f){
    filter=f;
    loadTickets();
}

async function loadTickets(){

    const res = await fetch("/admin/tickets");
    const tickets = await res.json();

    document.getElementById("total").innerText = tickets.length;
    document.getElementById("open").innerText =
        tickets.filter(t=>t.status==="Open").length;
    document.getElementById("resolved").innerText =
        tickets.filter(t=>t.status==="Resolved").length;

    let html="";

    tickets.forEach(t=>{

        if(filter!=="all" && t.status!==filter) return;

        html += `
        <div class="ticket">
            <b>${t.ticket_id}</b><br>
            ${t.query}<br>
            Status: ${t.status}<br><br>

            <button class="resolve"
                onclick="resolveTicket('${t.ticket_id}')">Resolve</button>

            <button class="delete"
                onclick="deleteTicket('${t.ticket_id}')">Delete</button>
        </div>`;
    });

    document.getElementById("ticketList").innerHTML = html;
}

async function resolveTicket(id){
    await fetch(`/admin/tickets/${id}/resolve`,{method:"POST"});
    loadTickets();
}

async function deleteTicket(id){
    await fetch(`/admin/tickets/${id}/delete`,{method:"DELETE"});
    loadTickets();
}

loadTickets();
setInterval(loadTickets,6000);

</script>

</body>
</html>
